spring:
  application:
    name: parkingmate
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/parkingmate;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8787}

app:
  admin-key: ${ADMIN_KEY:dev-admin}
  # true: 관리 화면 키 없이 사용 (시연 기간만). 끝나면 false
  admin-open: ${ADMIN_OPEN:false}
  sensor-key: ${SENSOR_KEY:dev-sensor}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  zone: Asia/Seoul
  # 시연용 고정 시각(예: 2027-01-16T10:00). 비우면 실제 시각.
  demo-clock: ${DEMO_CLOCK:}
  # true: 셔틀을 실제 운행표(토·일 09~18시)와 관계없이 매일 0시부터 계속 도는 것으로 계산(시연용). 실제 운영 시 false
  shuttle-always: ${SHUTTLE_ALWAYS:true}
  sensor:
    stale-minutes: 15
