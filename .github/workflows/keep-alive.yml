# Render 무료 서버는 15분 동안 요청이 없으면 잠들어서, 첫 접속이 40초 넘게 걸린다.
# 10분마다 한 번씩 불러서 깨워 둔다. (GitHub 예약 실행은 몇 분 늦을 수 있음)
name: keep-alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 서버 깨우기
        run: curl -fsS -m 120 -o /dev/null -w "%{http_code} %{time_total}s\n" https://parkingmate-api.onrender.com/api/now
      - name: 웹 열기
        run: curl -fsS -m 60 -o /dev/null -w "%{http_code}\n" https://parking-mate.vercel.app/
