# Render 블루프린트: 대시보드 → New → Blueprint → 이 저장소 선택
services:
  - type: web
    name: parkingmate-api
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    healthCheckPath: /api/now
    envVars:
      - key: DATABASE_URL        # Neon Connect 창의 주소 그대로 (postgresql://... 또는 jdbc:postgresql://...)
        sync: false
      - key: DATABASE_USERNAME   # 주소에 사용자·비밀번호가 들어 있으면 비워 둠
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: ADMIN_OPEN          # 시연 기간: 관리 화면 키 없이 사용. 끝나면 false
        value: "true"
      - key: SENSOR_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS     # 예) https://*.vercel.app,http://localhost:5173
        sync: false
      - key: DEMO_CLOCK          # 시연 때만 예) 2027-01-16T09:30 , 평소 비움
        sync: false
